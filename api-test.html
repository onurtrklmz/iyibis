<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>İYİBİS API Test BETA 3.4.2</title>
<script src="config-v33.js?v=33"></script>

<style>body{font-family:Arial,sans-serif;max-width:760px;margin:40px auto;padding:20px}button{padding:10px 16px}pre{background:#f1f5f9;padding:14px;white-space:pre-wrap}</style>
</head><body>
<h1>İYİBİS API Test — BETA 3.4.2</h1>
<p>Bu sayfa eski bridge-client.js kullanmaz.</p>
<button onclick="testApi()">API bağlantısını test et</button>
<pre id="out">Bekliyor…</pre>
<script>
async function testApi(){
  var out=document.getElementById('out');
  out.textContent='Worker/API kontrol ediliyor…';
  try{
    var value=await window.IYIBIS_API.call('webApiHealth',[]);
    out.textContent='BAŞARILI\n\n'+JSON.stringify(value,null,2);
  }catch(e){
    out.textContent='HATA\n\n'+(e&&e.message?e.message:String(e));
  }
}
</script></body></html>
